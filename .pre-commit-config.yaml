# Format (ruff-format) + syntax checks (ruff-check, check-toml) and basic
# hygiene. Ruff-format reads its config from pyproject.toml (line-length 100);
# ruff-check pins E9+F821 (syntax and undefined names), independent of each
# ruff version's default ruleset.
# Install once: pre-commit install
# One-time reformat: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: ["--select=E9,F821"]
      - id: ruff-format
        types_or: [python, pyi, jupyter]
