[project]
name = "ocharness"
version = "0.1.0"
description = "Effective-cost benchmark harness for Ollama Cloud (methodology v1)"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "xlsxwriter>=3.1"]

[project.scripts]
bench = "ocharness.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
